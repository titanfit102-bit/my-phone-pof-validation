name: PoF2.14 Vite Capability and Replay Threat Proof
on:
  push:
    branches: [feat/pof214-capability-authz-negative-proof]
    paths:
      - 'pof214/**'
      - '.github/workflows/pof214-authz-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pof214-synthetic
  cancel-in-progress: true
jobs:
  synthetic-session-proof:
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout this fixture-only repo, read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify synthetic fixture input SHA-256
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          sources=json.loads(pathlib.Path('fixture_sha256.json').read_text())['files']
          for path,sha in sources.items():
            assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()==sha,path
          print('PASS synthetic SHA256:',len(sources))
          PY
      - name: Compile Vite fixture officially
        working-directory: fixtures/vite
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test -s dist/index.html
          node --version
          npm --version
      - name: Install Chromium
        timeout-minutes: 5
        run: ./fixtures/vite/node_modules/.bin/playwright install chromium
      - name: Test per-asset capability gate and demonstrate URL replay
        timeout-minutes: 5
        run: node pof214/browser_proof.mjs
      - name: Preserve evidence even if test fails
        if: always()
        run: |
          mkdir -p results
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          folder=Path('fixtures/vite/dist')
          files={p.relative_to(folder).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(folder.rglob('*')) if p.is_file()}
          lock=Path('fixtures/vite/package-lock.json')
          Path('results/pof214-dist-sha256.json').write_text(json.dumps({'files':files,'lockSha256':hashlib.sha256(lock.read_bytes()).hexdigest() if lock.exists() else None},indent=2))
          PY
      - name: Upload synthetic evidence, no deployment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pof214-vite-capability-replay-evidence
          path: |
            results/
            fixtures/vite/package-lock.json
          retention-days: 7
          if-no-files-found: warn
