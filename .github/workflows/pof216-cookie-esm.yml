name: PoF2.16 HTTPS CHIPS Cookie and ESM Security Probe
on:
  push:
    branches: [feat/pof216-partitioned-cookie-esm-probe]
    paths:
      - "pof216/**"
      - ".github/workflows/pof216-cookie-esm.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pof216-synthetic
  cancel-in-progress: true
jobs:
  synthetic-https-cookie-probe:
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Read-only checkout synthetic fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify immutable PoF2.9 fixture checksums
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          d=json.loads(pathlib.Path('fixture_sha256.json').read_text())['files']
          for p,sha in d.items():
            assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==sha,p
          print('PASS original fixture hashes:',len(d))
          PY
      - name: Official Vite source compilation
        working-directory: fixtures/vite
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test -s dist/index.html
          node --version
          npm --version
      - name: Generate self-signed TEST-ONLY TLS keys on disposable runner
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 \
            -keyout pof216-ephemeral-key.pem -out pof216-ephemeral-cert.pem \
            -subj '/CN=PoF216 Ephemeral Loopback' \
            -addext 'subjectAltName=IP:127.0.0.1,IP:127.0.0.2,IP:127.0.0.3'
          chmod 600 pof216-ephemeral-key.pem
          node --check pof216/cookie_host.mjs
          node --check pof216/browser_proof.mjs
      - name: Install Chromium
        timeout-minutes: 5
        run: ./fixtures/vite/node_modules/.bin/playwright install chromium
      - name: Run HTTPS partitioned-cookie ESM probe
        timeout-minutes: 6
        run: node pof216/browser_proof.mjs
      - name: Destroy ephemeral private key
        if: always()
        run: |
          rm -f pof216-ephemeral-key.pem pof216-ephemeral-cert.pem
          test ! -e pof216-ephemeral-key.pem
      - name: Preserve non-secret experiment evidence
        if: always()
        run: |
          mkdir -p results
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          dist=Path("fixtures/vite/dist")
          files={p.relative_to(dist).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(dist.rglob("*")) if p.is_file()}
          lock=Path("fixtures/vite/package-lock.json")
          Path("results/pof216-inventory.json").write_text(json.dumps({"files":files,"lockSha256":hashlib.sha256(lock.read_bytes()).hexdigest() if lock.exists() else None},indent=2))
          PY
      - name: Evidence artifact without any private cert/key/token
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pof216-https-cookie-esm-security-evidence
          path: |
            results/
            fixtures/vite/package-lock.json
          retention-days: 7
          if-no-files-found: warn
